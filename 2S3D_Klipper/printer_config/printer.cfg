[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PE8, EXP1_2=PE7,
    EXP1_3=PE9, EXP1_4=PE10,
    EXP1_5=PE12, EXP1_6=PE13,    # Slot in the socket on this side
    EXP1_7=PE14, EXP1_8=PE15,
    EXP1_9=<GND>, EXP1_10=<5V>,

    # EXP2 header
    EXP2_1=PA6, EXP2_2=PA5,
    EXP2_3=PB1, EXP2_4=PA4,
    EXP2_5=PB2, EXP2_6=PA7,      # Slot in the socket on this side
    EXP2_7=PC15, EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=PC5

# See the sample-lcd.cfg file for definitions of common LCD displays.

# A [probe] section can be defined instead with a pin: setting identical
# to the sensor_pin: for a bltouch
[bltouch]
sensor_pin: ^PB7   # enable input pull-up
control_pin: PB6
x_offset: -27.5   # from testing following Klipper "Probe calibration" docs
y_offset: 22   # from Marlin config
z_offset: 0.840   # calibrated via Klipper's `PROBE_CALIBRATE` command
speed: 2
samples: 1

[safe_z_home]
home_xy_position: 120, 140
speed: 30
z_hop: 10   # for safe homing after manual bed leveling
z_hop_speed: 2   # make hopping to take 5s

[bed_mesh]
speed: 30
horizontal_move_z: 10   # move to this height for probing
mesh_min: 0, 30   # relative to the probe's location
mesh_max: 150, 200
probe_count: 3, 3
zero_reference_position: 92.5, 162   # position won't be adjusted (where calibration is performed)

