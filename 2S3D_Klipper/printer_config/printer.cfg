# This file contains common pin mappings for the BigTreeTech Octopus
# (non-Pro) boards.

# Important! Do not use this config with an Octopus Pro v1.1 board as
# doing so could result in a heater being inadvertently enabled.

# To use this config, start by identifying the micro-controller on the
# board - it may be an STM32F446, or STM32F429.  Select the
# appropriate micro-controller in "make menuconfig" and select "Enable
# low-level configuration options". For STM32F446 boards the firmware
# should be compiled with a "32KiB bootloader" and a "12MHz crystal"
# clock reference. For STM32F429 boards use a "32KiB bootloader" and
# an "8MHz crystal".

# See docs/Config_Reference.md for a description of parameters.

# Driver0
[stepper_x]
step_pin: PF13
dir_pin: !PF12   # X stepper moves to (-X, -Y) when buzzing by default, so switch to (+X, +Y) to align with standard CoreXY convention
enable_pin: !PF14
microsteps: 16
rotation_distance: 40
endstop_pin: PG6
position_endstop: 245   # placed at X-max (James Lorenz's past tests show -62 <= X <= 245)
position_max: 245
homing_speed: 50

# Driver1
[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
microsteps: 16
rotation_distance: 40
endstop_pin: PG9
position_endstop: -30
position_min: -30   # NOTE: explicitly specify mininum if it is not 0
position_max: 255   # to keep the toolhead within the printable area
homing_speed: 50

# Driver2
[stepper_z]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
microsteps: 16
full_steps_per_rotation: 200   # 1.8 deg stepper => 360 / 1.8 = 200 steps/rev (default is 200, just for clarification)
rotation_distance: 4   # from experiment: when set to 2, displacement is twice what specified
endstop_pin: probe:z_virtual_endstop   # for BLTouch (only primary Z needs this)
position_min: -3   # to allow negative positions for Z offset calibration
position_max: 200
homing_speed: 2
second_homing_speed: 1   # speed after first home, default half of homing_speed
homing_retract_dist: 3   # distance to retract after hitting the endstop during homing

# Driver3
# The Octopus only has 4 heater outputs which leaves an extra stepper
# This can be used for a second Z stepper, dual_carriage, extruder co-stepper,
# or other accessory such as an MMU
# This stepper is finally used as the Z stepper for relay tilting in previous Marlin system
[stepper_z1]
step_pin: PG4
dir_pin: !PC1   # There is one place where red wire in middle section got conneected to yellow on motor side
enable_pin: !PA0
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 4

# Driver4
[stepper_z2]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 4

# Logical Extrusion Header
# This is required for extrusion commands and manages temperature, etc. as well.
# This section can be motorless, in which case there must be downstream `extruder_stepper` sections
[extruder]
# legacy filament settings
nozzle_diameter: 0.400   # conventional placeholder
filament_diameter: 1.750   # legacy nominal value
# conservative commitioning limits in legacy E units
max_extrude_only_distance: 200
max_extrude_only_velocity: 2
max_extrude_only_accel: 2
pressure_advance: 0
# heater / thermistor settings for Titan Aero block
heater_pin: PA2 # HE0
sensor_pin:  PF4 # T0
sensor_type: ATC Semitec 104GT-2   # identified by Marlin pullup resistor specification
control: pid
pid_Kp: 6.73
pid_Ki: 0.49
pid_Kd: 22.88
max_power: 0.50   # Marlin limit hotend PWM to 128/255
min_temp: 0
max_temp: 250
min_extrude_temp: 0   # deliberately allow room-temperature extrusion for silicone

# Driver5
# This is used as the first silicone extruder
# `extruder_stepper` itself cannot implement extrusion, and it must follow a logical extruder.
[extruder_stepper pump0]
extruder: extruder
step_pin: PC13
dir_pin: PF0
enable_pin: !PF1
microsteps: 1   # previous Marlin uses full step
full_steps_per_rotation: 200
rotation_distance: 0.977995   # previous Marlin is 409 steps/unit E, with 50% mixing, 200 / (0.5 * 409) = 0.977995
# NOTE: 
# - Since 50% mixing covers the majority of the silicone extrusion, we use this to configure the extrusion steppers.
# - When we need to change the mixing ratio, we use `SET_EXTRUDER_ROTATION_DISTANCE` to adjust the rotation distance accordingly.

#[filament_switch_sensor material_0]
#switch_pin: PG12

# Driver6
# This is used as the second silicone extruder
[extruder_stepper pump1]
extruder: extruder
step_pin: PE2
dir_pin: PE3
enable_pin: !PD4
microsteps: 1
full_steps_per_rotation: 200
rotation_distance: 0.977995

