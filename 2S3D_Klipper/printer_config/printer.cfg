[mcu]
# To verify the serial information, run `ls /dev/serial/by-id/` on the host machine (after flashing `firmware.bin` from Klipper compilation).
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_420024000651343437373238-if00

# CAN bus is also available on this board

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 3000
max_z_velocity: 2   # initial safe threshold, later can be increased
max_z_accel: 20

########################################
# TMC2209 configuration
########################################

[tmc2209 stepper_x]
uart_pin: PC4
#diag_pin: PG6   # This is only used for sensorless homing
run_current: 0.800
stealthchop_threshold: 0   # disable stealthchop for low speeds

[tmc2209 stepper_y]
uart_pin: PD11
#diag_pin: PG9
run_current: 0.800
stealthchop_threshold: 0

[tmc2209 stepper_z]
uart_pin: PC6
#diag_pin: PG10
run_current: 0.650
stealthchop_threshold: 0

[tmc2209 stepper_z1]
uart_pin: PC7
#diag_pin: PG11
run_current: 0.650
stealthchop_threshold: 0

[tmc2209 stepper_z2]
uart_pin: PF2
run_current: 0.650
stealthchop_threshold: 0

[tmc2209 extruder_stepper pump0]
uart_pin: PE4
run_current: 0.350   # provisional unloaded-test current, may be changed later
interpolate: False   # disable interpolation following Marlin's previous settings
stealthchop_threshold: 0

[tmc2209 extruder_stepper pump1]
uart_pin: PE1
run_current: 0.350   # provisional unloaded-test current, may be changed later
interpolate: False   # disable interpolation following Marlin's previous settings
stealthchop_threshold: 0

